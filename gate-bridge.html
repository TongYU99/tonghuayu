<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>彤话屿 · 通行核验</title>
<style>html,body{margin:0;height:100%;background:transparent;}</style>
</head>
<body>
<!-- ===========================================================================
     彤话屿 · 口令核验桥接页（v2.24.23）
     为什么需要它：云服务按「精确 Origin」放行，只有本域名（主链）能直连。
     单文件版在 htmlcode.fun、GitHub 版在 github.io、分享版在同族的另一个
     worker 域名上（origin 不同），直连一律 403。
     于是这几条通道把这一页嵌进隐藏 iframe，由它（同源）代为询问云服务，
     再用 postMessage 把 ok / bad 回传 —— 这样它们的口令判定同样由服务端说了算，
     可以统计、可以吊销，而不是各自揣一份写死在源码里的口令。
     协议：父页 → 本页 {type:'th-gate-ask', nonce, pass, device, channel}
           本页 → 父页 {type:'th-gate-ready'|'th-gate-result', nonce, status, token}
     =========================================================================== -->
<script defer src="sdk/workbuddy-cloud.js" data-cloud-sdk></script>
<script>
(function(){
  var CLOUD_CFG = {
    endpoint: 'https://tonghua-island.app.workbuddy.host',
    oauthRelayBaseUrl: 'https://www.workbuddy.cn/v2/as/genie-baas/oauth',
    publishableKey: 'wbpk_LH8sgrzkWc4ZO24DLCSejY_gAwzDTrHkUv2OORSdmqWQDK8dB305PEp'
  };
  /* 只服务已知的外部通道，避免这一页变成任何人都能用的口令试错接口。
     wb = 同族但不同 origin 的 WorkBuddy 站点（分享版 tonghua-friends）。
     分享版若尚未创建，这一项是无害的 —— 不存在的 origin 发不出 message。 */
  var ALLOWED = ['https://www.htmlcode.fun', 'https://tongyu99.github.io',
                 'https://tonghua-friends.app.workbuddy.host'];

  var nonce = '';
  try{ nonce = new URLSearchParams(location.search).get('nonce') || ''; }catch(e){}
  if(!nonce) return;

  var client = null;
  function getClient(){
    if(client) return client;
    try{
      if(typeof WorkBuddyCloud === 'undefined' || !WorkBuddyCloud.createWorkBuddyCloud) return null;
      client = WorkBuddyCloud.createWorkBuddyCloud({
        endpoint: CLOUD_CFG.endpoint,
        oauthRelayBaseUrl: CLOUD_CFG.oauthRelayBaseUrl,
        publishableKey: CLOUD_CFG.publishableKey
      });
    }catch(e){ client = null; }
    return client;
  }
  function reply(obj, origin){
    try{ parent.postMessage(obj, origin || '*'); }catch(e){}
  }

  window.addEventListener('message', function(e){
    var d = e.data;
    if(!d || typeof d !== 'object') return;
    if(d.nonce !== nonce) return;
    if(d.type !== 'th-gate-ask') return;
    if(ALLOWED.indexOf(e.origin) < 0) return;

    var c = getClient();
    if(!c){ reply({ type:'th-gate-result', nonce:nonce, status:'unavailable' }, e.origin); return; }
    try{
      c.database.rpc('gate_check', {
        p_pass: (d.pass == null ? null : String(d.pass)),
        p_device: (d.device ? String(d.device) : null),
        p_channel: (d.channel ? String(d.channel) : 'bridge')
      }).then(function(r){
        if(r && r.error){ reply({ type:'th-gate-result', nonce:nonce, status:'unavailable' }, e.origin); return; }
        var v = r && r.data;
        reply({
          type:'th-gate-result', nonce:nonce,
          status: (v && v.status) ? String(v.status) : 'unavailable',
          token: (v && v.token) ? String(v.token) : ''
        }, e.origin);
      }, function(){
        reply({ type:'th-gate-result', nonce:nonce, status:'unavailable' }, e.origin);
      });
    }catch(err){
      reply({ type:'th-gate-result', nonce:nonce, status:'unavailable' }, e.origin);
    }
  });

  /* 通知父页：桥已就位，可以把口令递过来。
     ⚠️ 必须等 SDK 真的可用再报 —— 坑在这里：SDK 是 defer 脚本，而这个内联脚本在
     解析阶段就执行了。若此刻立刻报「就位」，父页会在 SDK 还没下载完时就把口令递过来，
     getClient() 返回 null → 整条桥接被判为 unavailable → 外部通道会静默退回源码里的
     明文口令（既不落日志，也吊销不掉）—— 正是这一版要消灭的那种「看起来正常、其实没生效」。
     所以轮询等 SDK，最多 2.5 秒；实在等不到也报就位，由父页按 unavailable 走兜底。 */
  var waited = 0;
  function announce(){
    if(getClient()){ reply({ type:'th-gate-ready', nonce:nonce }, '*'); return; }
    waited += 100;
    if(waited >= 2500){ reply({ type:'th-gate-ready', nonce:nonce }, '*'); return; }
    setTimeout(announce, 100);
  }
  announce();
})();
</script>
</body>
</html>
