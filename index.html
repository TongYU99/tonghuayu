<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- v2.24.22：iOS Safari 自适应。
     原来只有 width=device-width + initial-scale，两个坑都没堵：
       ① 双击会把页面放大一档且不会自动还原；
       ② 聚焦「字号小于 16px」的输入框时 Safari 会强制放大整页（失焦也不缩回）——
          这才是「页面有时候自动放大缩小」的真正原因，光禁缩放治不了根。
     所以两条一起上：viewport 关掉用户缩放，CSS 里把可输入元素提到 16px。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#1c1c1e">
<!-- v2.24.21：iOS Safari 的「添加到主屏幕」不读 manifest，只认这几个 apple-* meta。
     补上之后，三条通道（含单文件短链）在 iPhone 上都能独立全屏运行，不再套一层 Safari 边框。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="彤话屿">
<!-- v2.24.4：PWA —— manifest 让浏览器支持「安装到主屏幕」；sw.js 网络优先，打开即最新，离线有兜底 -->
<link rel="manifest" href="manifest.webmanifest">
<script>
if('serviceWorker' in navigator){ addEventListener('load',function(){ try{ navigator.serviceWorker.register('./sw.js').catch(function(){}); }catch(_){}}); }
</script>
<script>
/* v2.24.22：iOS 自适应的第二道闸。
   光靠 viewport 的 user-scalable=no 不够 —— 部分 iOS 版本（尤其是「添加到主屏幕」
   的独立模式下）照样允许双指捏合；再叠加一次「快速双击」也会放大一档。
   这里把这两个手势直接掐掉。只拦捏合与空白处双击：
     · 页面滚动、列表拖动、拖卡片  —— 走 pan，不受影响；
     · 输入框 / 文本域上的双击    —— 不拦，免得妨碍双击选词与光标定位。 */
(function(){
  try{
    ['gesturestart','gesturechange','gestureend'].forEach(function(n){
      document.addEventListener(n,function(e){ e.preventDefault(); },{passive:false});
    });
  }catch(_){}
  var lastTap=0;
  document.addEventListener('touchend',function(e){
    var now=Date.now(), dt=now-lastTap; lastTap=now;
    if(dt>=300) return;
    var t=e.target;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
    e.preventDefault();
  },{passive:false});
})();
</script>
<!-- 防缓存：保证手机端每次拉到最新页面 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- 分享开关：OFFLINE=1 时整站直接下线（页面不可访问） -->
<script>window.__OFFLINE__=false;</script>
<!-- 访问口令：留空=任何人可打开；填了=必须输入口令才能进入 -->
<script>window.__PASS__='0930';</script>
<title>彤话屿</title>
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* v2.24.22：iOS 自适应三件套
   ① text-size-adjust：横屏 / 旋转后 Safari 会自动把正文字号「撑大」，锁成 100% 不许它动；
   ② touch-action:manipulation：去掉双击缩放（保留滚动与拖动，不影响拖卡片），
      顺带干掉老安卓上那 300ms 的点击等待；
   ③ 可输入元素最小 16px 放在文件末尾的统一媒体查询里（见「iOS 输入框防放大」）。 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{touch-action:manipulation;}
:root{
  --accent:#1c1c1e;          /* 主题色（可在主题App中修改） */
  --accent-ink:#ffffff;
  --bg:#f1f1f3;
  --panel:#ffffff;
  --ink:#1c1c1e;
  --ink-2:#8a8a8f;
  --ink-3:#b9b9bf;
  --line:var(--chip);
  --radius:20px;
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --bubble-radius:18px;      /* 气泡风格（可在主题App中修改） */
  --page:var(--page);            /* 手机外的页面底色 */
  --bar:var(--bar);   /* 顶栏 / 输入栏 / 工具行底色 */
  --bar-2:var(--bar-2); /* 表情面板等 */
  --bar-3:var(--bar-3);  /* 应用顶栏 / 聊天列表顶栏 */
  --tint:var(--tint);  /* 桌面壁纸蒙层 */
  --soft:var(--soft);            /* 输入框底色 */
  --soft-2:var(--soft-2);          /* 操作面板条目底色 */
  --chip:var(--chip);            /* 次级按钮底色 */
  --chip-2:var(--chip-2);          /* 开关关闭态 */
  --sys:var(--sys);/* 系统提示条 */
  --skel:var(--skel);            /* 弹窗取消按钮 */
  --overlay:rgba(28,28,30,.32);
  --glass-1:rgba(255,255,255,.62); --glass-2:rgba(255,255,255,.85); --glass-line:rgba(255,255,255,.7);
  --danger-line:#f4d3d2; --warm:#fff7e8; --cool:#eef7ee; --pink:#f6d9e8;
  --cover-grad:linear-gradient(160deg,#ffffff,#f0f0f3);
  /* v2.24.4：开屏改蓝灰渐变（用户要求去掉偏咖色调） */
  --splash-bg:radial-gradient(120% 90% at 50% 6%,#fafbfd 0%,#eef2f8 52%,#dce3ee 100%);
  --splash-grad:linear-gradient(100deg,#a9b5c9 0%,#8292ac 36%,#57698a 70%,#8292ac 100%);
  --splash-dim:#98a5bb; --splash-line:#d5dce8; --splash-txt:#64718c;
  /* v2.24.12：须知卡在半透明开屏页上的玻璃底色 */
  --nt-card-bg:rgba(255,255,255,.94);
}
/* ============ 夜间模式 ============ */
html[data-theme="dark"]{
  --bg:#0f0f11;
  --panel:#1c1c1f;
  --ink:#f2f2f4;
  --ink-2:#9b9ba1;
  --ink-3:#6d6d74;
  --line:#2a2a2e;
  --shadow:0 2px 10px rgba(0,0,0,.5);
  --page:#000;
  --bar:rgba(22,22,24,.92);
  --bar-2:rgba(22,22,24,.95);
  --bar-3:rgba(22,22,24,.9);
  --tint:rgba(0,0,0,.35);
  --soft:#26262a;
  --soft-2:#26262a;
  --chip:#2e2e33;
  --chip-2:#3a3a40;
  --sys:rgba(255,255,255,.08);
  --skel:#2a2a2e;
  --overlay:rgba(0,0,0,.55);
  --glass-1:rgba(255,255,255,.09); --glass-2:rgba(255,255,255,.13); --glass-line:rgba(255,255,255,.14);
  --danger-line:#5a2a2a; --warm:#3a3222; --cool:#22321f; --pink:#3a2330;
  --cover-grad:linear-gradient(160deg,#2a2a30,#1b1b1f);
  /* v2.24.4：开屏暗色同步冷化为蓝灰 */
  --splash-bg:radial-gradient(120% 90% at 50% 6%,#171b23 0%,#10141c 52%,#070a11 100%);
  --splash-grad:linear-gradient(100deg,#525d78 0%,#8592b2 38%,#c1cbe2 72%,#8592b2 100%);
  --splash-dim:#68738a; --splash-line:#2b3140; --splash-txt:#95a0ba;
  --nt-card-bg:rgba(28,28,32,.86);
}
/* 开屏在暗色下的线条改为浅色 */
html[data-theme="dark"] .sp-island .ln{stroke:#e6e6ea;}
html[data-theme="dark"] .sp-island .ln-thin{stroke:#e6e6ea;}
html[data-theme="dark"] .sp-island .ln-fill{fill:#e6e6ea;}
html[data-theme="dark"] .sp-boat path{stroke:#e6e6ea;}
html[data-theme="dark"] .sp-line-in{background:#d8d8de;}
html[data-theme="dark"] .sp-remember input{accent-color:#d8d8de;}
html[data-theme="dark"] .tile{background:rgba(255,255,255,.1) !important;}
html[data-theme="dark"] #desktop.wp-dots{background-image:radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.4px);}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--page);display:flex;justify-content:center;font-size:15px;color:var(--ink);
  transition:background .25s ease;
}
#phone{
  width:100%;max-width:480px;height:100dvh;position:relative;overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.12);
}
@media (min-width:520px){ #phone{ border-left:1px solid #ccc; border-right:1px solid #ccc; } }
/* 大屏手机（Reno16 等 6.5"+）放大基础字号与触控目标 */
@media (min-height:780px) and (min-width:360px){
  body{font-size:16px;}
  .app-icon .tile{width:60px;height:60px;border-radius:19px;}
  .tool{width:56px;}
  .inputbar input{height:40px;}
  .sendbtn{width:58px;height:39px;}
}
@media (max-height:640px){ #homePages{padding-top:22px;} #timeWidget{padding:17px 20px;margin-bottom:16px;} #timeWidget .clock{font-size:42px;} #timeWidget .date{font-size:13.5px;} }
.hide{display:none !important;}
/* 自定义 CSS 若把「隐藏」改掉会导致整站叠在一起，这里在注入层之后强制兜底 */
#phone .hide,#msgList .hide{display:none !important;}
/* 兜底：自定义 CSS 写了过窄的 max-width 时，至少保住气泡基本可读宽度 */
.bubble{min-width:0;}

/* ============ 状态栏 ============ */
#statusBar{
  height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:13px;font-weight:700;z-index:5;position:relative;
  color:var(--ink);
}
#statusBar .right{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;}
.batt{display:inline-flex;align-items:center;gap:2px;}
.batt .box{width:20px;height:10px;border:1.5px solid var(--ink);border-radius:3px;position:relative;}
.batt .box::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:70%;background:var(--ink);border-radius:1px;}
.batt .box::after{content:'';position:absolute;right:-4px;top:2.5px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0;}

/* ============ 桌面 ============ */
#desktop{
  flex:1;overflow-y:auto;overflow-x:hidden;position:relative;
  padding:10px 18px 20px;display:flex;flex-direction:column;
}
/* 默认波点壁纸（可在主题App中更换/上传） */
#desktop.wp-dots{background-image:radial-gradient(#d3d3d8 1.4px, transparent 1.6px);background-size:22px 22px;}
#desktop.wp-stripe{background-image:repeating-linear-gradient(45deg,#e9e9ec 0 14px,#f1f1f3 14px 28px);}
#desktop.wp-plain{background-image:none;}
#desktop.wp-img{background-size:cover;background-position:center;}
.wall-tint{position:absolute;inset:0;background:var(--tint);pointer-events:none;}

/* v2.24.7：用户撤回「整体下移」—— 322 的布局合适，保持原样（此占位注释留作版本标记） */
/* 时间小组件 —— v2.17.0 再放大一圈：横向撑满、时钟 58px */
#timeWidget{
  margin:2px 0 26px;padding:22px 24px;border-radius:26px;
  background:var(--glass-1);backdrop-filter:blur(8px);
  box-shadow:var(--shadow);border:1px solid var(--glass-line);
  display:flex;align-items:center;justify-content:space-between;position:relative;
}
#timeWidget .clock{font-size:58px;font-weight:800;letter-spacing:.5px;line-height:1;}
#timeWidget .date{font-size:15px;color:var(--ink-2);margin-top:9px;font-weight:500;}
#timeWidget .quote{
  max-width:158px;text-align:right;font-size:12px;color:var(--ink-2);line-height:1.65;
  font-style:italic;
}
#coinMini{display:inline-flex;align-items:center;gap:4px;background:var(--glass-2);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:700;box-shadow:var(--shadow);}

/* 应用网格 */
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;position:relative;}
/* v2.24.0：真实手机桌面 —— 小组件与应用混合网格，支持长按拖拽换位
   v2.24.3：desk-item 加 touch-action:pan-x —— 水平翻页手势保留，垂直微动不再触发
   浏览器 pointercancel 杀掉长按（拖拽很难触发的元凶）；屏蔽长按选择/系统菜单 */
.desk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;position:relative;align-items:stretch;}
.desk-item{position:relative;min-width:0;touch-action:pan-x;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.desk-item.w2{grid-column:span 2;}
.desk-item.w4{grid-column:span 4;}
.desk-item.h2{grid-row:span 2;}
/* v2.24.3：组件下方 widgets 小字标注（参考用户截图） */
.desk-item.wcap{display:flex;flex-direction:column;}
.desk-item.wcap .wdg{flex:1 1 auto;min-height:0;}
.desk-item .wdg-cap{flex:none;text-align:center;font-size:10px;color:var(--ink-3);margin-top:4px;letter-spacing:.04em;}
.desk-item .wdg{width:100%;height:100%;box-sizing:border-box;}
.desk-item .wdg.wdg-photo,.desk-item .wdg.wdg-cal2,.desk-item .wdg.wdg-music2{height:auto;}
/* v2.24.3：备忘/日历 2×2 大卡（图二）—— 大日期 + 星期 + 多行备忘 */
.desk-item .wdg-cal2{aspect-ratio:1/1;padding:16px;border-radius:22px;justify-content:flex-start;}
.wdg-cal2 .cal2-big{font-size:36px;font-weight:800;line-height:1.1;margin-top:10px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;white-space:nowrap;} /* v2.24.18：月/日一排居中 */
.wdg-cal2 .cal2-big small{font-size:15px;font-weight:600;margin:0 3px;}
.wdg-cal2 .cal2-week{font-size:13px;font-weight:700;color:var(--ink-2);margin-top:4px;}
.wdg-cal2 .cal2-note{font-size:11.5px;color:var(--ink-2);line-height:1.65;margin-top:auto;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;}
/* v2.24.5：备忘组件改成「待办事项」卡片（仿手机待办 App）——
   有待办：未完成在前，最多列 3 条，带勾选框；没待办：退化成当日日期。 */
.desk-item .wdg-todo{aspect-ratio:1/1;padding:14px;border-radius:22px;justify-content:flex-start;cursor:pointer;}
.wdg-todo .wdg-t{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:.02em;}
.wdg-todo .wdg-t svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.wdg-todo .todo-left{flex:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-left:2px;}
.wdg-todo .cal2-big{font-size:34px;font-weight:800;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;justify-content:center;white-space:nowrap;} /* v2.24.18：月/日一排居中不换行 */
.wdg-todo .cal2-big small{font-size:14px;font-weight:600;margin:0 3px;}
.wdg-todo .cal2-week{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:3px;}
.wdg-todo .cal2-empty{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-3);margin-top:auto;padding-top:8px;line-height:1.4;}
.wdg-todo .cal2-empty svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.wdg-todo .cal2-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;overflow:hidden;}
.wdg-todo .cal2-item{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;line-height:1.35;color:var(--ink);}
.wdg-todo .cal2-box{flex:none;width:14px;height:14px;margin-top:1px;border-radius:5px;border:1.5px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;}
.wdg-todo .cal2-box svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.wdg-todo .cal2-item.done .cal2-box{background:var(--accent);border-color:var(--accent);color:#fff;}
.wdg-todo .cal2-txt{flex:1;min-width:0;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wdg-todo .cal2-item.done .cal2-txt{text-decoration:line-through;color:var(--ink-3);}
.wdg-todo .cal2-more{font-size:10.5px;color:var(--ink-3);margin-top:2px;}
/* 待办编辑面板（action-sheet 内） */
.todo-list{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow-y:auto;margin-bottom:10px;}
.todo-row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line,#ececec);}
.todo-row.done .todo-tx{text-decoration:line-through;color:var(--ink-3);}
.todo-box{flex:none;width:20px;height:20px;border-radius:7px;border:1.6px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-sizing:border-box;transition:background .15s,border-color .15s;}
.todo-box svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.todo-row.done .todo-box{background:var(--accent);border-color:var(--accent);}
.todo-tx{flex:1;min-width:0;font-size:13.5px;line-height:1.4;word-break:break-all;}
.todo-x{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px;cursor:pointer;border-radius:8px;}
.todo-x:active{background:var(--glass-2);}
.todo-add{display:flex;gap:8px;align-items:center;}
.todo-add input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line,#e2e2e2);background:var(--glass-2);color:var(--ink);font-size:13.5px;box-sizing:border-box;}
.todo-add input:focus{outline:none;border-color:var(--accent);}
.todo-add .btn{flex:none;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
/* v2.24.3：音乐 4×2 全宽播放器横条（图一）—— 封面+歌名+进度条+控制键 */
.desk-item .wdg-music2{aspect-ratio:16/7;padding:14px 16px;border-radius:22px;justify-content:space-between;}
.wdg-music2 .mu2-top{display:flex;align-items:center;gap:12px;min-width:0;}
.wdg-music2 .mu2-art{flex:none;width:44px;height:44px;border-radius:14px;background:var(--glass-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);box-shadow:var(--shadow);}
.wdg-music2 .mu2-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.wdg-music2 .mu2-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wdg-music2 .mu2-sub{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wdg-music2 .mu2-eq{flex:none;display:flex;align-items:flex-end;gap:2.5px;height:16px;}
.wdg-music2 .mu2-eq i{width:3px;border-radius:2px;background:var(--ink-3);height:35%;}
.wdg-music2.playing .mu2-eq i{background:var(--accent);animation:eq 1.1s ease-in-out infinite;}
.wdg-music2.playing .mu2-eq i:nth-child(2){animation-delay:.18s;}
.wdg-music2.playing .mu2-eq i:nth-child(3){animation-delay:.36s;}
.wdg-music2 .mu2-bar{display:flex;align-items:center;gap:8px;}
.wdg-music2 .mu2-track{flex:1;height:4px;border-radius:2px;background:var(--ink-3);opacity:.28;overflow:hidden;}
.wdg-music2 .mu2-fill{display:block;height:100%;width:0;border-radius:2px;background:var(--ink);}
/* v2.24.14：进度条改成由 audio 真实进度驱动（data-muprog），不再用 14s 假动画 */
.wdg-music2.playing .mu2-fill{animation:none;}
.wdg-music2:not(.playing) .mu2-fill{width:0 !important;}
@keyframes mu2prog{0%{width:4%;}88%{width:96%;}100%{width:96%;}}
.wdg-music2 .mu2-ctl{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.wdg-music2 .mu2-gap{flex:1;}
.wdg-music2 .mu2-btn{flex:none;width:34px;height:34px;border:none;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;padding:0;}
.wdg-music2 .mu2-btn:active{background:var(--glass-2);transform:scale(.94);}
.wdg-music2 .mu2-btn.mu2-main{width:44px;height:44px;background:var(--glass-2);box-shadow:var(--shadow);}
/* v2.24.5：播放中提示 —— 桌面组件本身没有播放器面板，指引到音乐页看官方播放器 */
.wdg-music2 .mu2-now{flex:none;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--ink-3);letter-spacing:.02em;}
.wdg-music2 .mu2-now svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.desk-item.dragging{opacity:.22;filter:grayscale(.4);}
.desk-item.drop-hint{outline:2px dashed var(--accent);outline-offset:3px;border-radius:20px;}
body.dragging{user-select:none;-webkit-user-select:none;}
body.dragging *{cursor:grabbing !important;}
#dragGhost{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);opacity:.95;filter:drop-shadow(0 10px 22px rgba(0,0,0,.3));}
/* v2.23.0：手机桌面式左右滑动分页 + 页点指示 */
#homePages{flex:1;display:flex;overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;}
#homePages::-webkit-scrollbar{display:none;}
.hp-page{min-width:100%;width:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0 0 6px;display:flex;flex-direction:column;}
.hp-page .hp-pad{padding:0 10px;}   /* v2.24.4：左右 18→10px，与 #dock 的 10px 外边距齐平 */
#pageDots{flex:none;display:flex;justify-content:center;align-items:center;gap:7px;padding:4px 0 12px;}
#pageDots i{width:6px;height:6px;border-radius:3px;background:var(--ink-2);opacity:.35;transition:all .22s ease;cursor:pointer;}
#pageDots i.on{width:18px;background:var(--ink);opacity:.75;}
/* v2.23.0：桌面小组件（日历 / 照片 / 音乐迷你播放器，内容可编辑） */
.wdg{
  border-radius:22px;background:var(--glass-1);backdrop-filter:blur(8px);
  box-shadow:var(--shadow);border:1px solid var(--glass-line);
  padding:16px;position:relative;overflow:hidden;cursor:pointer;
  min-height:118px;display:flex;flex-direction:column;
}
/* v2.24.0：照片大组件 —— 参考手机相册风格的整幅照片卡，放首页占 2×2。
   v2.24.2：去掉 min-height:200px（会把同行 1×1 方卡拉高），改用跨行自然撑高 + aspect-ratio 兜底 */
.wdg.wdg-photo{padding:0;aspect-ratio:1/1;min-height:0;}
.wdg.wdg-photo .ph-cap{padding:26px 14px 10px;font-size:12px;}
.wdg:active{transform:scale(.98);}
.wdg.wdg-wide{grid-column:span 2;min-height:104px;}
.wdg .wdg-t{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.08em;display:flex;align-items:center;gap:5px;}
.wdg .wdg-t svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.wdg .wdg-big{font-size:36px;font-weight:800;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums;}
.wdg .wdg-big small{font-size:14px;font-weight:600;margin:0 2px;}
.wdg .wdg-sub{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.6;}
.wdg .wdg-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3);border:1.5px dashed var(--ink-3);border-radius:18px;margin-top:10px;padding:18px 0;font-size:11px;}
.wdg .wdg-ph svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.wdg-photo{padding:0;border-radius:22px;}
.wdg-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* v2.24.6：用户明确要求「传完图片之后不要加入底部的渐变」——
   去掉原先的 linear-gradient(transparent,rgba(0,0,0,.5)) 遮罩。
   配字改成照片下方的一枚独立半透明小胶囊，不再压在照片底部做渐变过渡。 */
/* v2.24.19：用户反馈「配的文字不用加胶囊框，直接放文字就好」——
   去掉半透明胶囊底与模糊，只留文字本体（加一层柔和文字阴影保证在浅色照片上可读）。 */
.wdg-photo .ph-cap{
  position:absolute;left:12px;right:12px;bottom:10px;
  padding:0;font-size:11.5px;font-weight:600;color:#fff;
  background:none;border-radius:0;backdrop-filter:none;
  text-shadow:0 1px 4px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
}
.wdg-photo .ph-cap:empty{display:none;}
.wdg-music .mu-name{font-size:12.5px;font-weight:800;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wdg-music .mu-art{font-size:10px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-bars{display:flex;align-items:flex-end;gap:2.5px;height:13px;margin-top:7px;}
.mu-bars i{width:3px;border-radius:2px;background:var(--ink-3);height:30%;}
.wdg-music.playing .mu-bars i{background:var(--accent);animation:eq 1.1s ease-in-out infinite;}
.wdg-music.playing .mu-bars i:nth-child(2){animation-delay:.14s;}
.wdg-music.playing .mu-bars i:nth-child(3){animation-delay:.28s;}
.wdg-music.playing .mu-bars i:nth-child(4){animation-delay:.42s;}
.wdg-music.playing .mu-bars i:nth-child(5){animation-delay:.56s;}
@keyframes eq{0%,100%{height:24%;}50%{height:100%;}}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.app-icon:active{transform:scale(.92);}
.app-icon .tile{
  width:56px;height:56px;border-radius:18px;
  background:var(--glass-2);box-shadow:var(--shadow);
  border:1px solid var(--glass-line);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  transition:transform .1s;position:relative;
}
.app-icon .label{font-size:11px;color:var(--ink-2);font-weight:600;}
.badge{
  position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;
  background:#e0443f;color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
}

/* Dock —— v2.24.3 再上移（底边距 10→26px），并加大与页点的呼吸感，更贴近真机桌面比例 */
#dock{
  flex:none;margin:8px 10px calc(env(safe-area-inset-bottom) + 26px);
  background:var(--glass-1);backdrop-filter:blur(10px);
  border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--glass-line);
  display:flex;justify-content:space-around;padding:12px 8px;
}
#dock .app-icon .tile{width:54px;height:54px;border-radius:17px;background:var(--glass-2);}
#dock .app-icon{gap:5px;}
#dock .app-icon .label{display:block;font-size:10.5px;}

/* ============ 应用窗口 ============ */
#appWindow{
  position:absolute;inset:0;z-index:30;background:var(--bg);
  display:flex;flex-direction:column;
  animation:appIn .22s ease;
}
@keyframes appIn{from{opacity:0;transform:scale(1.04);}to{opacity:1;transform:none;}}
#appHead{
  flex:none;padding:calc(env(safe-area-inset-top) + 12px) 14px 11px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--line);background:var(--bar-3);backdrop-filter:blur(10px);
}
/* v2.20.0：名称+状态竖排但改为靠左 —— 居中会被刘海屏挖孔摄像头遮住 */
#appHead .title{font-size:16.5px;font-weight:800;flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-width:0;}
#appHead .title .sub{font-size:11px;color:var(--ink-2);font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.iconbtn{
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;flex:none;
  background:var(--panel);box-shadow:var(--shadow);font-size:15px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;
}
#appBody{flex:1;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch;}
#appBody.chat-mode{padding:0;display:flex;flex-direction:column;overflow:hidden;}

/* ============ 通用组件 ============ */
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.card .title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px;line-height:1.5;}
.card .title svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.card .title .count{font-weight:400;}
/* v2.23.0：说明文案不再局促 —— 行高/间距整体放宽 */
.card .desc{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.85;}
.card .desc code{background:var(--soft);border-radius:6px;padding:1.5px 7px;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);word-break:break-all;}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);}
.rowline:last-child{border-bottom:none;}
.rowline .name{font-size:14px;font-weight:600;line-height:1.5;}
.rowline .meta{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.7;}
.rowline .right{display:flex;align-items:center;gap:10px;}
.count{font-size:12px;color:var(--ink-3);}
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:6px;}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 14px;
  font-size:14px;outline:none;background:var(--soft);color:var(--ink);font-family:inherit;
}
.field textarea{min-height:120px;resize:vertical;line-height:1.7;}
.btn{
  display:inline-block;border:none;cursor:pointer;background:var(--accent);color:var(--accent-ink);
  font-size:14px;font-weight:600;padding:11px 18px;border-radius:16px;transition:transform .1s;font-family:inherit;
}
.btn:active{transform:scale(.96);}
.btn.ghost{background:var(--chip);color:var(--ink);}
.btn.danger{background:var(--panel);color:#e0443f;border:1px solid var(--danger-line);}
.btn.small{padding:7px 13px;font-size:12px;border-radius:12px;}
.btn.block{width:100%;}
.avatar{
  width:42px;height:42px;border-radius:50%;flex:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;color:#fff;
  box-shadow:var(--shadow);
}
.avatar.sm{width:34px;height:34px;font-size:13px;}
.avatar.md{width:44px;height:44px;font-size:18px;}
.avatar.lg{width:74px;height:74px;font-size:28px;}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:30px 0;}
.section-label{font-size:12px;color:var(--ink-2);font-weight:700;margin:4px 2px 10px;}

.switch{
  width:46px;height:27px;border-radius:14px;background:var(--chip-2);
  position:relative;cursor:pointer;transition:background .2s;flex:none;border:none;
}
.switch::after{
  content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:left .2s;
}
.switch.on{background:var(--accent);}
.switch.on::after{left:21px;}

.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.92);color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:80%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============ 聊天 ============ */
#msgList{flex:1;overflow-y:auto;overflow-x:visible;padding:20px 16px 22px;min-height:0;}
.divider{text-align:center;font-size:11px;color:var(--ink-3);margin:14px 0 10px;}
/* 系统提示条（拍一拍 / 已读 / 领取红包 等）—— 原来是 11px 居中浅色，太小 */
.sysline{text-align:center;font-size:12.5px;color:var(--ink-2);margin:9px 32px;background:var(--sys);border-radius:12px;padding:5px 12px;line-height:1.55;font-weight:500;}
/* 气泡外的装饰角标需要溢出可见：row 放开裁切并留出上下空间 */
.row{display:flex;align-items:flex-end;gap:8px;margin:16px 0;overflow:visible;position:relative;}
.row .bubble{overflow:visible;}
.row.me{flex-direction:row-reverse;}
.bubble{
  max-width:72%;padding:10px 14px;border-radius:var(--bubble-radius);
  background:var(--panel);box-shadow:var(--shadow);line-height:1.55;
  word-break:break-word;white-space:pre-wrap;border-bottom-left-radius:6px;animation:pop .25s ease;
}
.row.me .bubble{
  background:var(--accent);color:var(--accent-ink);
  border-bottom-left-radius:var(--bubble-radius);border-bottom-right-radius:6px;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:none;}}
/* v2.24.6：红包改成**微信那种紧凑小卡片**。
   用户反馈上一版 186px 的「红信封 + 大金币 開」太大、太玩具感。
   微信真实样式是：一张 118×128 左右的小红卡，左上角是金色钱袋图标 + 一句「xx的红包」，
   正中是小小的「開」字封口，底部一行「微信红包」水印。这里按这个比例复刻。 */
.rp-wrap.rp{
  background:none;padding:0;min-width:0;box-shadow:none;border-radius:0;
  border-bottom-left-radius:0;overflow:visible;
}
.row.me .rp-wrap.rp{border-bottom-right-radius:0;}
.rp-wrap.rp .rp-env{
  position:relative;width:118px;height:128px;border-radius:10px;overflow:hidden;
  background:linear-gradient(160deg,#f5713c 0%,#ec4b2c 42%,#d93a20 100%);
  box-shadow:0 3px 10px rgba(180,44,28,.28);
  display:flex;flex-direction:column;padding:10px 10px 0;
}
/* 顶部那道弧形高光（微信用的是很淡的一层，别太亮） */
.rp-wrap.rp .rp-flap{
  position:absolute;left:0;right:0;top:0;height:44px;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0));
  border-bottom-left-radius:50% 22px;border-bottom-right-radius:50% 22px;
  pointer-events:none;
}
.rp-wrap.rp .rp-head{
  position:relative;display:flex;align-items:center;gap:5px;
  color:#ffe7c2;font-size:11px;line-height:1.3;padding:0;
}
.rp-wrap.rp .rp-head svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.rp-wrap.rp .rp-head .rp-from{
  font-size:11px;font-weight:500;opacity:.94;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
/* 中央的「開」字封口 —— 微信就是一枚小小的金色圆章，直径 36px 左右 */
.rp-wrap.rp .rp-body{
  position:relative;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding-bottom:6px;
}
.rp-wrap.rp .rp-open{
  width:36px;height:36px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 36% 30%,#ffeec4,#f8cf72 62%,#dda63a 100%);
  box-shadow:0 1px 4px rgba(120,20,10,.30),inset 0 -1px 2px rgba(150,80,0,.22);
  display:flex;align-items:center;justify-content:center;
}
.rp-wrap.rp .rp-open b{font-size:16px;font-weight:700;color:#9c3a0c;line-height:1;font-family:"KaiTi","STKaiti",serif;}
.rp-wrap.rp .rp-bot{
  position:absolute;left:0;right:0;bottom:0;padding:4px 0 5px;text-align:center;
  font-size:9px;letter-spacing:.06em;color:rgba(255,231,194,.62);
  background:rgba(0,0,0,.06);
}
.rp-wrap.rp .rp-txt{margin-top:6px;font-size:10.5px;font-weight:600;color:#ffe7c2;text-align:center;line-height:1.35;}
.rp-wrap.rp .rp-sub{margin-top:2px;font-size:9px;color:rgba(255,231,194,.68);text-align:center;}
/* 可领取：轻微呼吸引导（不再整块发光，微信没这个效果，做淡一点） */
.rp-wrap.rp.claimable{cursor:pointer;}
.rp-wrap.rp.claimable .rp-open{animation:rpBob 1.6s ease-in-out infinite;}
@keyframes rpBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
.rp-wrap.rp.claimable:active{transform:scale(.975);}
/* 已领取：整卡降饱和压暗，封口换成对勾 */
.rp-wrap.rp.claimed{cursor:default;}
.rp-wrap.rp.claimed .rp-env{background:linear-gradient(160deg,#d9a79f 0%,#c9908a 48%,#b3776e 100%);box-shadow:0 2px 7px rgba(120,60,50,.20);}
.rp-wrap.rp.claimed .rp-open{background:radial-gradient(circle at 36% 30%,#f8f1ec,#ddcbc2 60%,#bda69c 100%);}
.rp-wrap.rp.claimed .rp-open b{color:#7a6259;font-family:inherit;font-size:15px;}
.rp-wrap.rp.claimed .rp-bot{color:rgba(251,234,230,.66);}
/* 引用回复条（输入框上方） */
.quote-bar{padding:0 14px;}
.quote-bar.hide{display:none;}
.quote-bar .qb-inner{display:flex;align-items:center;gap:8px;background:var(--soft-2);border-left:3px solid var(--accent);border-radius:10px;padding:7px 10px;margin-bottom:6px;animation:pop .2s;}
.quote-bar .qb-txt{flex:1;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.quote-bar .qb-txt b{color:var(--ink);}
.quote-bar .qb-x{cursor:pointer;font-size:12px;color:var(--ink-3);padding:2px 4px;}
.typing{display:flex;gap:4px;padding:14px 16px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s;}
.typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

.chat-body{flex:1;display:flex;flex-direction:column;min-height:0;padding:0;}
/* 输入栏：v2.19.0 起常驻（微信式），高度缩短；把手 / 收起箭头 / collapsed 全部移除 */
.inputbar-wrap{
  flex:none;background:var(--bar);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);position:relative;
  padding-bottom:env(safe-area-inset-bottom);
}
.inputbar{
  padding:5px 12px 8px;display:flex;align-items:center;gap:7px;
  flex:none;overflow:hidden;
}
.inputbar input{
  flex:1;height:37px;border:none;outline:none;border-radius:19px;padding:0 15px;
  background:var(--panel);box-shadow:var(--shadow);font-size:14.5px;color:var(--ink);min-width:0;
}
/* v2.24.0：发送按钮再优化 —— 空输入时幽灵态融入输入栏，有文字点亮为主题色药丸 */
.sendbtn{
  width:54px;height:36px;border-radius:18px;border:none;cursor:pointer;flex:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));
  color:var(--accent-ink);
  font-size:12.5px;font-weight:700;letter-spacing:2px;text-indent:2px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .12s,box-shadow .2s,background .2s,color .2s,opacity .2s;
}
.sendbtn.idle{
  background:var(--panel);color:var(--ink-3);box-shadow:var(--shadow);border:1px solid var(--line);
}
.sendbtn:active{transform:scale(.93);box-shadow:0 1px 4px color-mix(in srgb,var(--accent) 20%,transparent);}
.toolrow{display:flex;justify-content:space-around;padding:7px 8px calc(env(safe-area-inset-bottom) + 7px);background:var(--bar);border-top:1px solid var(--line);flex:none;}
.tool{
  width:52px;border-radius:12px;border:none;background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;
  color:var(--ink);opacity:.8;
}
.tool svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.tool b{font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--ink-2);}
.tool:active{transform:scale(.9);}
/* v2.17.0 微信化：输入栏右侧「+」号 —— 表情 / 通话 / 拍一拍等全部收进加号面板（v2.19.0 缩小） */
.plusbtn{
  width:37px;height:37px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;flex:none;
  background:var(--panel);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s;
}
.plusbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
.plusbtn:active{transform:scale(.92);}
.plusbtn.on{background:var(--chip);color:var(--ink);transform:rotate(45deg);}
/* 加号面板：微信风格格子（表情 / 表情包 / 拍一拍 / 通话 / @ / 更多） */
.plus-panel{
  background:var(--bar);border-top:1px solid var(--line);flex:none;
  padding:14px 10px calc(env(safe-area-inset-bottom) + 14px);
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;
  animation:ppIn .18s ease;
}
@keyframes ppIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.plus-item:active{transform:scale(.93);}
.plus-item .pi-ic{
  width:52px;height:52px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;
}
.plus-item .pi-ic svg{width:23px;height:23px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.plus-item b{font-size:10.5px;font-weight:600;color:var(--ink-2);letter-spacing:.03em;}
/* 消息时间戳 —— 原来 9px/--ink-3 太小太浅，看不清 */
.mts{font-size:11px;color:var(--ink-2);align-self:flex-end;margin:0 3px 5px;flex:none;font-variant-numeric:tabular-nums;font-weight:500;}
#appExtra.dots{font-size:19px;font-weight:800;letter-spacing:2px;line-height:1;}
.emoji-panel{
  display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--bar-2);border-top:1px solid var(--line);flex:none;max-height:180px;overflow-y:auto;
}
.emoji-panel span{font-size:22px;cursor:pointer;padding:4px 6px;border-radius:8px;}
.emoji-panel span:active{background:var(--chip);}

/* 联系人列表 */
.contact-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.contact-item:last-child{border-bottom:none;}
.contact-item:active{background:var(--soft-2);}
.contact-item .info{flex:1;min-width:0;}
.contact-item .info .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.contact-item .info .pv{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.unread{
  min-width:18px;height:18px;border-radius:9px;background:#e0443f;color:#fff;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;flex:none;
}
.delx{color:var(--ink-3);cursor:pointer;font-size:15px;padding:6px;flex:none;}
.delx:hover{color:#e0443f;}

/* 操作面板（聊天 + 号） */
.action-sheet{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.25);}
.sheet-panel{
  position:relative;width:100%;background:var(--panel);border-radius:24px 24px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
  animation:sheetUp .22s ease;
}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.5;}to{transform:none;opacity:1;}}
.sheet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-top:8px;}
.sheet-grid .act{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--ink-2);}
.sheet-grid .act .ic{
  width:50px;height:50px;border-radius:16px;background:var(--chip);
  display:flex;align-items:center;justify-content:center;
}
.sheet-grid .act .ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

/* ============ 音乐 App（v2.23.0；v2.24.0 播放器美化：渐变卡+黑胶盘+播放/暂停） ============ */
.mu-hero{
  border-radius:24px;padding:20px 18px 18px;margin-bottom:14px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--glass-1)) 0%,var(--glass-1) 58%,transparent 100%);
  border:1px solid var(--glass-line);box-shadow:var(--shadow);
}
.mu-hero .mu-glow{position:absolute;top:-56px;right:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 26%,transparent),transparent 68%);pointer-events:none;}
.mu-disc{
  width:132px;height:132px;border-radius:50%;margin:6px auto 14px;position:relative;flex:none;
  background:
    radial-gradient(circle at 50% 50%,var(--accent) 0 17%,transparent 17.5%),
    repeating-radial-gradient(circle at 50% 50%,#2b2b30 0 2px,#222226 2px 4px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 32px rgba(0,0,0,.32),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 0 0 22px rgba(255,255,255,.03);
}
.mu-disc::after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.4);}
.mu-disc .mu-note{color:rgba(255,255,255,.9);display:flex;}
.mu-disc.spin{animation:spin 9s linear infinite;}
.mu-ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;}
.mu-ctl button{
  border:1.5px solid var(--glass-line);background:var(--glass-2);color:var(--ink);
  border-radius:50%;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;
  transition:transform .1s,background .15s;
}
.mu-ctl button:active{transform:scale(.9);}
.mu-ctl .c-sm{width:40px;height:40px;}
.mu-ctl .c-sm svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.mu-ctl .c-main{width:54px;height:54px;background:var(--accent);color:var(--accent-ink);border:none;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 36%,transparent);}
.mu-ctl .c-main svg{width:21px;height:21px;}
.mu-name-hero{font-size:17px;font-weight:800;text-align:center;line-height:1.4;}
.mu-artist-hero{font-size:12px;color:var(--ink-2);text-align:center;margin-top:3px;}
/* v2.24.14：音乐页播放区 —— 站内直连播放，所以能画出真实进度条 */
.mu-out{width:100%;border-radius:16px;margin-top:14px;background:var(--panel);box-shadow:var(--shadow);padding:14px 16px;}
.mu-out-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);margin-bottom:9px;}
.mu-out-hint .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite;}
.mu-out .bar{height:4px;border-radius:3px;background:var(--soft-2);overflow:hidden;cursor:pointer;}
.mu-out .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .2s linear;}
.mu-out .tm{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums;}
/* 音量条 */
.mu-vol{display:flex;align-items:center;gap:10px;margin-top:12px;}
.mu-vol .lb{display:flex;color:var(--ink-3);flex:none;}
.mu-vol input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--soft-2);outline:none;}
.mu-vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;}
.mu-vol .pc{font-size:10px;color:var(--ink-3);width:28px;text-align:right;flex:none;font-variant-numeric:tabular-nums;}
.mu-track{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.mu-track:last-child{border-bottom:none;}
.mu-track:active{background:var(--soft-2);}
.mu-track .no{font-size:11px;color:var(--ink-3);width:20px;text-align:center;flex:none;font-variant-numeric:tabular-nums;}
.mu-track .ti{flex:1;min-width:0;}
.mu-track .ti .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-track .ti .a{font-size:11px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mu-track.on .ti .n{color:var(--accent);}
.mu-track .act{color:var(--ink-3);display:flex;gap:10px;flex:none;padding:4px 2px;}
.mu-track .act span{cursor:pointer;display:flex;}
.mu-track .act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* 一起听横幅（聊天输入栏上方；v2.24.0 内嵌网易云小播放器，邀约后直接能按播放） */
.listen-bar{
  flex:none;display:flex;align-items:center;gap:10px;
  background:var(--bar);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:8px 14px;position:relative;flex-wrap:wrap;
}
.listen-bar .lb-eq{display:flex;align-items:flex-end;gap:2px;height:15px;flex:none;}
.listen-bar .lb-eq i{width:3px;background:var(--accent);border-radius:2px;height:40%;animation:eq 1s ease-in-out infinite;}
.listen-bar .lb-eq i:nth-child(2){animation-delay:.2s;}
.listen-bar .lb-eq i:nth-child(3){animation-delay:.4s;}
.listen-bar .lb-tx{flex:1;min-width:0;font-size:11px;color:var(--ink-2);line-height:1.4;}
.listen-bar .lb-tx b{display:block;color:var(--ink);font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.listen-bar .btn{flex:none;}

/* v2.24.14：浮窗从「206px 大面板」改成「52px 小圆」。
   —— 一次解决三条反馈：
   ①太占地方碍事 → 默认只留一颗小圆，点一下才展开控制面板；
   ②「叉掉浮窗音乐也停」→ 关闭键改成「收回小圆」，播放完全不中断；
   ③播放本身不出声 → 出声源已从网易云 iframe 换成站内直连 <audio>（#muHost 里挂着）。
   ⚠️ 结构铁律仍然成立：**#muHost（音频节点）终身不动**，收/展只切 CSS 类，
   绝不销毁重建 —— 否则又会「卡一下、从头播」。 */
#muFloat{
  position:absolute;right:12px;bottom:96px;z-index:70;
  touch-action:none;user-select:none;-webkit-user-select:none;
}
#muFloat.hide{display:none;}
#muFloat.dragging{box-shadow:0 14px 34px rgba(0,0,0,.32);}
/* 音频节点容器：不可见，纯发声用（终身不动） */
#muHost{position:absolute;width:1px;height:1px;left:-9999px;top:0;overflow:hidden;opacity:0;pointer-events:none;}
#muHost audio{width:1px;height:1px;}

/* 收起态：一颗 52px 小圆 */
#muFloat .mu-mini{
  position:relative;width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 8px 22px rgba(0,0,0,.24),0 1px 0 rgba(255,255,255,.5) inset;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--ink);transition:transform .16s,box-shadow .18s;
}
#muFloat .mu-mini:active{transform:scale(.92);}
#muFloat .mu-mini .disc{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#000));
  color:var(--accent-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 34%,transparent);}
#muFloat .mu-mini .disc svg{width:17px;height:17px;}
#muFloat .mu-mini.spin .disc{animation:spin 7s linear infinite;}
/* 小圆上的音符跳动（在播时露出来） */
#muFloat .mu-mini .eq{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:2px;height:9px;}
#muFloat .mu-mini .eq i{width:2.5px;border-radius:2px;background:var(--accent);height:38%;animation:eq 1s ease-in-out infinite;}
#muFloat .mu-mini .eq i:nth-child(2){animation-delay:.18s;}
#muFloat .mu-mini .eq i:nth-child(3){animation-delay:.36s;}
/* v2.24.15b：小圆右上角的「关掉浮窗」按钮 —— 不用展开面板就能收掉它。
   默认半透明低调（不干扰音乐图标），悬停/按下才亮起来。 */
#muFloat .mu-mini .x{
  position:absolute;top:-4px;right:-4px;width:19px;height:19px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--panel);border:1px solid var(--line);color:var(--ink-2);
  box-shadow:0 2px 6px rgba(0,0,0,.18);opacity:.55;transition:opacity .15s,transform .15s,background .15s;
}
#muFloat .mu-mini .x svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;}
#muFloat .mu-mini .x:hover{opacity:1;background:var(--soft-2);}
#muFloat .mu-mini .x:active{transform:scale(.88);opacity:1;}
/* 暂停态：不转、不跳 */
#muFloat.paused .mu-mini.spin .disc{animation:none;}
#muFloat.paused .mu-mini .eq{display:none;}
/* 小圆上的加载转圈 */
#muFloat .mu-mini .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;
  border-top-color:var(--accent);animation:spin .8s linear infinite;display:none;}
#muFloat.loading .mu-mini .ring{display:block;}
#muFloat.loading .mu-mini .eq{display:none;}

/* 展开态：小圆缩成面板上方的「收回」按钮，下方是控制面板 */
#muFloat .mu-panel{
  position:absolute;right:0;bottom:60px;
  width:212px;border-radius:18px;overflow:hidden;
  background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.26),0 1px 0 rgba(255,255,255,.5) inset;
  border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:none;
}
#muFloat.expanded .mu-panel{display:block;animation:muPanelIn .16s ease-out;}
@keyframes muPanelIn{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:none;}}
#muFloat .mu-panel-hd{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;}
#muFloat .mu-panel-hd .ico{flex:none;color:var(--accent);display:flex;}
#muFloat .mu-panel-hd .tx{flex:1;min-width:0;}
#muFloat .mu-float-name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#muFloat .mu-float-sub{font-size:10px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#muFloat .mu-panel-hd .cls{flex:none;width:24px;height:24px;border-radius:8px;border:none;background:var(--soft-2);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
#muFloat .mu-panel-hd .cls svg{width:13px;height:13px;}
/* 进度条（真播放进度，来自 audio timeupdate） */
#muFloat .mu-prog{display:flex;align-items:center;gap:8px;padding:2px 14px 0;}
#muFloat .mu-prog .bar{flex:1;height:3px;border-radius:2px;background:var(--soft-2);overflow:hidden;cursor:pointer;}
#muFloat .mu-prog .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .18s linear;}
#muFloat .mu-prog .tm{font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none;}
#muFloat .mu-float-ctl{display:flex;align-items:center;justify-content:space-around;padding:6px 8px 10px;}
#muFloat .mu-fb{
  width:32px;height:32px;border:none;background:transparent;color:var(--ink);border-radius:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
#muFloat .mu-fb:active{background:var(--soft-2);transform:scale(.93);}
#muFloat .mu-fb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
#muFloat .mu-fb.mu-fb-main{width:38px;height:38px;background:var(--soft-2);}
#muFloat .mu-fb.mu-fb-main svg{width:17px;height:17px;}
#muFloat .mu-note{font-size:10px;color:var(--ink-3);text-align:center;padding:0 12px 9px;line-height:1.45;}
/* v2.24.15b：面板底部的两个明确动作 —— 「收成小圆」与「关掉浮窗」。
   旧版只有「收起」，用户想让它彻底消失只能删歌，所以这里把话说白。 */
#muFloat .mu-act{display:flex;gap:8px;padding:0 12px 11px;}
#muFloat .mu-act button{
  flex:1;height:29px;border-radius:10px;font-size:11px;font-weight:700;cursor:pointer;padding:0;
  border:1px solid var(--line);background:var(--soft-2);color:var(--ink-2);
  transition:background .15s,transform .12s;
}
#muFloat .mu-act button:active{transform:scale(.96);}
#muFloat .mu-act .mu-close-btn{background:transparent;color:var(--ink-3);}
#muFloat .mu-act .mu-close-btn:hover{color:var(--ink);background:var(--soft-2);}
/* v2.24.15：歌单里的状态徽标（让用户一眼看出哪首能放、哪首为什么放不了） */
.mu-tag{
  display:inline-block;font-size:9.5px;font-weight:700;line-height:1.5;padding:0 5px;border-radius:6px;
  vertical-align:1px;letter-spacing:.2px;
}
.mu-tag.vip{color:#b26a00;background:rgba(226,150,30,.14);border:1px solid rgba(226,150,30,.3);}
.mu-tag.net{color:var(--ink-3);background:var(--soft-2);border:1px solid var(--line);}

/* 通话（微信风格：深色沉浸） */
#callOverlay{
  position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;overflow:hidden;
  background:linear-gradient(180deg,#2a2a2e 0%,#202023 60%,#1a1a1d 100%);
  animation:fadeIn .2s;
}
#callOverlay .call-bg-avatar{padding:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.18);box-shadow:0 14px 38px rgba(0,0,0,.5);animation:callPulse 2.4s ease-in-out infinite;}
#callOverlay .call-bg-avatar .avatar{width:96px;height:96px;font-size:36px;}
@keyframes callPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
#callOverlay .call-name{font-size:23px;font-weight:800;letter-spacing:.5px;color:#fff;}
#callOverlay .call-state{font-size:13px;color:var(--sys);}
#callOverlay .call-lines{height:100px;overflow:hidden;display:flex;flex-direction:column-reverse;gap:6px;align-items:center;}
#callOverlay .call-lines div{font-size:13px;color:rgba(255,255,255,.92);background:rgba(255,255,255,.12);backdrop-filter:blur(4px);padding:7px 15px;border-radius:16px;animation:pop .3s;}
/* 群通话：成员头像墙 */
#callOverlay .call-members{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:300px;padding:9px;border-radius:20px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);min-height:70px;align-items:center;animation:callPulse 2.4s ease-in-out infinite;}
#callOverlay .call-mem{display:flex;flex-direction:column;align-items:center;gap:4px;}
#callOverlay .call-mem .avatar{width:46px;height:46px;font-size:18px;border:1.5px solid rgba(255,255,255,.25);}
#callOverlay .call-mem span{font-size:10px;color:rgba(255,255,255,.65);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 「我」在成员墙里高亮，一眼能看出自己已加入 */
#callOverlay .call-mem-me .avatar{border-color:rgba(120,220,150,.85);box-shadow:0 0 0 2.5px rgba(120,220,150,.28);}
#callOverlay .call-mem-me span{color:rgba(150,235,170,.95);font-weight:700;}
#callOverlay .call-controls{display:flex;gap:26px;margin-top:16px;align-items:center;}
.call-ctl{
  width:54px;height:54px;border-radius:50%;border:none;
  background:rgba(255,255,255,.14);color:#fff;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .1s,background .2s;
}
.call-ctl svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.call-ctl.off{background:rgba(255,255,255,.4);}
.call-ctl:active{transform:scale(.92);}
.call-ctl-col{display:flex;flex-direction:column;align-items:center;gap:5px;}
.call-ctl-col small{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:1px;}
.hangup{
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:#e0443f;box-shadow:0 6px 18px rgba(224,68,63,.45);
}
.hangup svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;}
/* 来电：接听 / 挂断 */
.call-btns{display:flex;gap:56px;margin-top:18px;}
.call-col{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
.call-col .ring{
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.call-col .ring svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;}
.call-col .ring.ok{background:#37c06f;box-shadow:0 6px 18px rgba(55,192,111,.4);animation:callRing 1.6s ease infinite;}
.call-col .ring.no{background:#e0443f;box-shadow:0 6px 18px rgba(224,68,63,.4);}
.call-col small{font-size:11px;color:var(--sys);letter-spacing:2px;}
@keyframes callRing{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
/* 最小化悬浮气泡 */
#callMini{
  position:absolute;right:14px;bottom:110px;z-index:75;width:58px;height:58px;border-radius:50%;
  background:rgba(28,28,30,.88);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.3);cursor:grab;gap:1px;touch-action:none;user-select:none;-webkit-user-select:none;
}
#callMini:active{cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.4);transform:scale(1.05);}
#callMini .avatar{width:24px;height:24px;font-size:12px;}
#callMini b{font-size:10px;font-weight:700;}
.hangup{
  width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;font-size:24px;color:#fff;
  background:#e0443f;box-shadow:0 6px 18px rgba(224,68,63,.4);margin-top:4px;
}

/* 微信朋友圈 —— 封面仿微信比例（偏宽的横幅，约占屏宽 3:2） */
/* v2.17.0：背景 150→190px（太窄显得局促）；头像容器移出 overflow:hidden 的 cover，
   原来头像下缘 22px 被 cover 裁掉（用户截图：头像只显示一半） */
.wm-head{position:relative;}
.wm-cover{height:190px;background:linear-gradient(135deg,var(--chip) 0%,#dcdce2 55%,#cbcbd3 100%);position:relative;border-radius:0 0 16px 16px;overflow:hidden;}
.wm-cover .cover-edit{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);padding:6px 11px;border-radius:14px;cursor:pointer;z-index:2;}
.wm-cover .cover-edit:active{transform:scale(.96);}
.wm-me{position:absolute;right:14px;bottom:-22px;display:flex;align-items:center;gap:10px;z-index:2;}
.wm-me .nm{color:var(--ink);font-weight:800;font-size:16px;text-shadow:0 1px 6px rgba(255,255,255,.65);}
.wm-me .avatar{border-radius:12px;border:2.5px solid var(--panel);width:64px;height:64px;font-size:26px;}
.wm-me .avatar img{border-radius:10px;}
.wm-post{display:flex;gap:10px;padding:16px 2px;border-bottom:1px solid var(--line);}
.wm-post:last-child{border-bottom:none;}
.wm-post .avatar{border-radius:10px;}
.wm-nm{font-weight:700;color:var(--ink);font-size:14.5px;}
.wm-txt{font-size:14.5px;line-height:1.68;margin:5px 0;white-space:pre-wrap;word-break:break-word;}
.wm-time{font-size:12px;color:var(--ink-2);margin-top:8px;display:flex;gap:12px;align-items:center;}
.wm-ops{margin-top:10px;background:rgba(0,0,0,.035);border-radius:12px;padding:9px 14px;display:flex;gap:20px;font-size:13px;color:var(--ink-2);}
.wm-ops span{cursor:pointer;}
.wm-stk{font-size:58px;line-height:1.35;margin-top:4px;}
.wm-stk img{max-width:150px;border-radius:10px;display:block;}
/* v2.17.0：评论字号 15(继承)→12.5px、行距 1.9、行间细分隔线（用户两轮反馈字大行密） */
.wm-feed .cmt{background:rgba(0,0,0,.035);font-size:12.5px;line-height:1.9;border-radius:12px;padding:8px 12px;color:var(--ink-2);}
.wm-feed .cmt .cmt-like{padding:1px 0 5px;}
.wm-feed .cmt .cmt-line{padding:3px 0;display:flex;align-items:baseline;flex-wrap:wrap;}
.wm-feed .cmt .cmt-line + .cmt-line{border-top:1px solid var(--line);}
.wm-feed .cmt .cmt-rp{font-style:normal;color:var(--ink-3);}
.wm-feed .cmt .cmt-ract{font-size:11px;color:#576b95;cursor:pointer;margin-left:auto;padding-left:10px;flex:none;}
.wm-feed .cmt .cmt-ract:active{opacity:.6;}
.wm-feed .cmt b{font-weight:700;color:var(--ink);}

/* 塔罗牌 */
.tarot-card{
  width:150px;height:225px;margin:14px auto 10px;border-radius:16px;
  background:var(--cover-grad);box-shadow:0 12px 28px rgba(0,0,0,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  animation:pop .35s;border:1px solid var(--line);
}
.tarot-card.rev{transform:rotate(180deg);}
.tarot-card .em{font-size:52px;}

/* 已读标记 —— 原来 10px/--ink-3 太浅 */
.read-tag{font-size:11.5px;color:var(--ink-2);align-self:flex-end;margin:0 3px 5px;flex:none;font-weight:500;}
/* 经期月历标记 */
.cal-day.pd-start{background:var(--accent);color:var(--accent-ink);font-weight:700;}
.cal-day.pd-window{background:var(--pink);}
.cal-day.pd-end{background:#e9a5c9;color:#7a2a52;font-weight:700;}
.cal-day.pd-start.pd-end{background:var(--accent);color:var(--accent-ink);}
.cal-day.pd-pred{box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:12px;}
.cal-day.pd-pred::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
/* 日历选中态 */
.cal-day.sel{outline:2px solid var(--accent);outline-offset:-2px;}

/* ============ 集市 ============ */
.goods-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.goods{
  background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px;
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
}
.goods .em{font-size:34px;}
.goods .nm{font-size:13px;font-weight:700;}
.goods .pr{font-size:12px;color:var(--ink-2);}
.cart-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}

/* ============ 日历 ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-head .mon{font-size:17px;font-weight:800;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal-grid .wd{font-size:11px;color:var(--ink-3);padding:6px 0;}
.cal-day{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;position:relative;background:transparent;border:none;color:var(--ink);font-family:inherit;
}
.cal-day.other{color:var(--ink-3);opacity:.45;}
.cal-day.today{background:var(--accent);color:var(--accent-ink);font-weight:700;}
.cal-day.hasnote::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--ink-2);}

/* ============ 小游戏 ============ */
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.game-tile{
  background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:18px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;
}
.game-tile .em{font-size:30px;}
.rps-row{display:flex;justify-content:space-around;margin:18px 0;}
.rps-hand{font-size:40px;cursor:pointer;padding:12px;border-radius:18px;background:var(--panel);box-shadow:var(--shadow);border:none;transition:transform .1s;}
.rps-hand:active{transform:scale(.9);}
.game-canvas{display:block;margin:10px auto;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);}
.pad{display:flex;justify-content:center;gap:14px;margin-top:12px;}
.pad button{
  width:60px;height:60px;border-radius:18px;border:none;background:var(--panel);box-shadow:var(--shadow);
  font-size:22px;line-height:1;cursor:pointer;color:var(--ink);
  transition:transform .08s,box-shadow .08s;touch-action:manipulation;-webkit-user-select:none;user-select:none;
}
.pad button:active{transform:scale(.88);box-shadow:none;}
.pad button.hit{background:var(--soft);transform:scale(.9);}
/* 十字方向盘（贪吃蛇 / 俄罗斯方块共用） */
.pad.sn-dpad,.pad.tz-dpad{display:grid;grid-template-columns:repeat(3,60px);grid-auto-rows:60px;gap:8px;justify-content:center;}
.pad.sn-dpad>span,.pad.tz-dpad>span{
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted,#9a9aa2);
}
.pad.tz-dpad button{font-size:17px;font-weight:700;}
.pad.tz-dpad button small{display:block;font-size:9px;font-weight:600;opacity:.55;margin-top:1px;}
/* v2.24.22（用户反馈：「贪吃蛇方向键占位太大」）：
   原来一套十字键是 3×60 + 2×8 = 196px 见方，手机上一屏被它吃掉将近四分之一。
   缩到 3×48 + 2×6 = 156px 见方（省掉 40px 高 / 40px 宽），
   48px 仍高于 44px 的触摸目标下限，拇指盲按不会打偏；棋盘与按钮之间的留白同步收紧。
   俄罗斯方块的操作盘维持原尺寸不动 —— 它那半盘按钮有 5 个、还带小字，缩了会难按。 */
.pad.sn-dpad{
  --snkey:48px;
  grid-template-columns:repeat(3,var(--snkey));   /* 列宽也要跟着缩，否则格子仍是 60px、白缩 */
  grid-auto-rows:var(--snkey);
  gap:6px;margin-top:8px;
}
.pad.sn-dpad button{width:var(--snkey);height:var(--snkey);border-radius:15px;font-size:19px;}
.pad.sn-dpad>span{font-size:11px;}

/* ============ 双人俄罗斯方块（v2.24.20 新增） ============ */
#tzWrap{position:relative;display:flex;justify-content:center;margin:10px auto;}
#tzCv{display:block;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);max-width:100%;height:auto;}
#tzMsg{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border-radius:14px;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);
  font-size:15px;font-weight:800;color:var(--ink);text-align:center;padding:16px;line-height:1.7;
}
#tzMsg.hide{display:none;}
.tz-pill{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:12px;font-weight:700;background:var(--soft);color:var(--ink);
}
.tz-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto;}
.mem-cell{
  aspect-ratio:1;border-radius:14px;background:var(--panel);box-shadow:var(--shadow);
  font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;
}
.mem-cell.open{background:var(--warm);}
.mem-cell.done{background:var(--cool);opacity:.6;cursor:default;}
/* ===== 五子棋棋盘（v2.24.20：标准 9 路棋盘，棋子落在线的交叉点上） =====
   做法：棋盘画 9 条竖线 + 9 条横线，线的交叉点位于 (i*34+22, j*34+22)；
   落子按钮是一个 9×9 的透明网格，每个格子 34px，
   左/上内边距 = 22−17 = 5px，正好让「格子中心」= 交叉点。 */
.gomoku{
  --gc:34px; --gpad:5px; --gline:22px;
  position:relative;width:calc(var(--gc)*9 + var(--gpad)*2);height:calc(var(--gc)*9 + var(--gpad)*2);
  margin:14px auto;padding:var(--gpad);border-radius:12px;background:#e5c89d;
  box-shadow:0 2px 10px rgba(120,88,48,.22);box-sizing:content-box;
}
/* v2.24.20：窄屏（≤360px）自动缩格，保证棋盘完整可见（34 → 32，交叉点同步 20/4） */
@media (max-width:360px){
  .gomoku{--gc:32px;--gpad:4px;--gline:20px;}
  .gomoku button::after{width:25px;height:25px;}
}
/* v2.24.20：矮屏（横屏 / 小窗）缩格，避免棋盘顶掉操作区 */
@media (max-height:660px){
  .gomoku{--gc:30px;--gpad:3px;--gline:18px;}
  .gomoku button::after{width:23px;height:23px;}
}
.gomoku .gk-lines{position:absolute;inset:0;pointer-events:none;}
.gomoku .gk-grid{
  position:relative;display:grid;grid-template-columns:repeat(9,var(--gc));grid-template-rows:repeat(9,var(--gc));
}
.gomoku button{
  width:var(--gc);height:var(--gc);border:none;background:transparent;cursor:pointer;
  padding:0;display:flex;align-items:center;justify-content:center;
}
.gomoku button::after{
  content:'';width:26px;height:26px;border-radius:50%;display:block;transition:transform .08s;
}
.gomoku button:hover::after{background:rgba(28,28,30,.10);}
.gomoku button.b::after{background:#1c1c1e;box-shadow:0 1px 3px rgba(0,0,0,.45);}
.gomoku button.w::after{background:#fdfdfd;box-shadow:0 1px 3px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.06);}
.gomoku button.last::after{outline:2px solid #e0443f;outline-offset:1px;}
.gomoku button.last.b::after{box-shadow:0 0 0 2px rgba(224,68,63,.55),0 1px 3px rgba(0,0,0,.45);}

/* ============ 朋友圈 ============ */
.mom{
  background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;
}
.mom .head{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.mom .txt{font-size:14.5px;line-height:1.68;white-space:pre-wrap;word-break:break-word;}
.mom .ops{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--ink-2);}
.mom .ops span{cursor:pointer;}
/* 评论区（点赞 + 评论）—— 原来 12px 挤在一起，加大字号与行距 */
.mom .cmt{background:var(--soft-2);border-radius:12px;padding:10px 13px;font-size:13px;margin-top:10px;line-height:1.85;letter-spacing:.02em;}
.mom .cmt b{font-weight:700;color:var(--ink);}
.mom .cmt .cmt-line{padding:3px 0;}
.mom .cmt .cmt-line + .cmt-line{border-top:1px solid var(--line);}
.mom .cmt .cmt-like{padding:2px 0 4px;}

/* ============ 心情 / 纪念日 / 信箱 / 问卷 / 灯塔 ============ */
.mood-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.mood-pick span{font-size:26px;cursor:pointer;padding:6px;border-radius:12px;}
.mood-pick span.sel{background:var(--warm);box-shadow:var(--shadow);}
.ann-days{font-size:26px;font-weight:800;color:var(--accent);}
.tracking-ring{
  width:150px;height:150px;border-radius:50%;margin:16px auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;position:relative;box-shadow:var(--shadow);
}
.tracking-ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--panel);}
.tracking-ring .val{position:relative;font-size:22px;font-weight:800;}
.tracking-ring .lab{position:relative;font-size:11px;color:var(--ink-2);}
.fortune{text-align:center;padding:26px 16px;}
.fortune .lv{font-size:26px;font-weight:800;margin:8px 0;}
.fortune .tx{font-size:14px;color:var(--ink-2);line-height:1.8;}

/* 问卷 */
.q-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px;}
.q-card .q{font-size:15px;font-weight:700;line-height:1.6;margin-bottom:12px;}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px;}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:11px;font-size:13px;cursor:pointer;color:var(--ink-2);font-family:inherit;}
.seg button.on{background:var(--panel);font-weight:700;color:var(--ink);box-shadow:var(--shadow);}
/* 设置页专用 seg：字卡库药丸风格 + 线性图标（v2.17.0 重做，替换原描边小方块 tbtn） */
.seg.set-seg{border-radius:16px;padding:4px;gap:2px;}
.seg.set-seg button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-3);border-radius:12px;
  transition:color .15s,background .15s;
}
.seg.set-seg button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.seg.set-seg button.on{color:var(--ink);font-weight:800;}
/* 顶部功能方块导航（主题页 / 设置页共用） */
.tabbar{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  background:var(--chip);border-radius:18px;padding:8px;margin-bottom:14px;
}
.tabbar.four{grid-template-columns:repeat(4,1fr);}
.tabbar.six{grid-template-columns:repeat(6,1fr);}
.tabbar.three{grid-template-columns:repeat(3,1fr);}
.tabbar .tbtn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;background:transparent;border-radius:13px;padding:9px 2px;cursor:pointer;
  color:var(--ink-2);font-family:inherit;transition:background .15s,color .15s,box-shadow .15s;
  min-height:56px;
}
.tabbar .tbtn .ti{font-size:19px;line-height:1;font-style:normal;}
.tabbar .tbtn .tn{font-size:10px;line-height:1.2;font-weight:600;white-space:nowrap;}
.tabbar .tbtn.on{background:var(--panel);color:var(--ink);font-weight:800;box-shadow:var(--shadow);}
.tabbar .tbtn:active{transform:scale(.96);}
.tab-head{display:flex;align-items:center;gap:9px;margin:2px 0 12px;}
.tab-head .th-back{
  border:none;background:var(--chip);color:var(--ink-2);cursor:pointer;font-family:inherit;
  width:30px;height:30px;border-radius:10px;font-size:15px;line-height:1;flex:none;
}
.tab-head .th-title{font-size:15px;font-weight:800;color:var(--ink);}
.tab-head .th-sub{font-size:11px;color:var(--ink-3);margin-left:auto;}

/* ============ 导出数据弹窗 ============ */
.exp-sec{font-size:11px;font-weight:800;color:var(--ink-3);margin:14px 0 6px;letter-spacing:.05em;}
.exp-row{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  padding:10px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--soft);
  margin-bottom:8px;transition:border-color .15s,background .15s;
}
.exp-row:active{transform:scale(.99);}
.exp-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer;}
.exp-row .name{font-size:13.5px;font-weight:600;color:var(--ink);}
.exp-row .meta{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5;}
.exp-row .count{font-size:10px;color:var(--ink-3);font-weight:600;margin-left:4px;}

/* ============ 表情包 ============ */
.stk-panel{
  padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:var(--bar-2);border-top:1px solid var(--line);flex:none;
  max-height:250px;overflow-y:auto;
}
.stk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.stk-head .t{font-size:12px;font-weight:700;color:var(--ink-2);}
.stk-head button{border:none;background:transparent;font-size:12px;color:var(--ink-2);cursor:pointer;}
.stk-head button.on{color:var(--ink);font-weight:700;}
.stk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.stk{
  aspect-ratio:1;border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:24px;
  cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);
}
.stk img{width:100%;height:100%;object-fit:cover;}
.stk .delx{position:absolute;top:2px;right:2px;background:rgba(28,28,30,.6);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;}
.stk.add{border:1.5px dashed var(--ink-3);background:transparent;box-shadow:none;color:var(--ink-3);font-size:22px;}
/* v2.22.0：表情包消息不再套气泡（无背景 / 无内边距），直接展示表情本身 */
.stk-b{background:none;padding:0;border:none;box-shadow:none;max-width:132px;}
.stk-b .stk-em{font-size:52px;line-height:1.25;display:block;}
.stk-b img{max-width:112px;max-height:112px;display:block;border-radius:12px;}

/* ============ v2.25.0：图片（聊天发图 / 动态配图 / 看大图） ============ */
/* 聊天气泡里的图片：气泡留一点内边距，图片圆角略小于气泡 */
.img-bubble{padding:5px;}
.msg-img{display:block;max-width:186px;max-height:246px;width:auto;height:auto;border-radius:10px;cursor:zoom-in;}
/* 全屏看大图（挂在 #phone 内，与 action-sheet 同层） */
.img-viewer{
  position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  animation:fadeIn .16s ease;cursor:zoom-out;
}
.img-viewer img{max-width:94%;max-height:82%;object-fit:contain;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.img-viewer .iv-tip{font-size:12px;color:rgba(255,255,255,.62);}
/* 朋友圈动态配图：1 张大图 / 2~4 张两列 / 5~9 张三列 */
.mom-imgs{display:grid;gap:4px;margin:6px 0 4px;max-width:246px;}
.mom-imgs.g1{grid-template-columns:1fr;max-width:196px;}
.mom-imgs.g2{grid-template-columns:repeat(2,1fr);}
.mom-imgs.g3{grid-template-columns:repeat(3,1fr);}
.mom-img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:7px;display:block;cursor:zoom-in;background:var(--soft);}
.mom-imgs.g1 .mom-img{aspect-ratio:auto;max-height:280px;object-fit:contain;}
/* 发表动态时已选图片的缩略图 */
.mom-pick{display:flex;flex-wrap:wrap;gap:6px;}
.mom-pick-i{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;background:var(--soft);}
.mom-pick-i img{width:100%;height:100%;object-fit:cover;display:block;}
.mom-pick-i .mp-x{
  position:absolute;top:1px;right:1px;width:17px;height:17px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;font-size:10px;line-height:17px;text-align:center;cursor:pointer;
}

/* ============ 气泡 / 字体选择面板 ============ */
.bub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.bub-card{
  border:1.5px solid var(--line);border-radius:14px;padding:9px;cursor:pointer;
  background:var(--soft);transition:border-color .15s,background .15s;
  position:relative;
}
.bub-card.sel{border-color:var(--accent);border-width:2.5px;background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);}
.bub-on{
  position:absolute;top:5px;right:5px;z-index:2;
  font-size:9px;font-weight:800;line-height:1;padding:3px 7px;border-radius:9px;
  background:var(--accent);color:var(--accent-ink);
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.bub-demo{
  border-radius:12px;padding:9px 11px;font-size:12px;color:var(--accent-ink);
  min-height:52px;display:flex;align-items:center;line-height:1.55;word-break:break-word;
}
.bub-nm{font-size:11px;font-weight:700;color:var(--ink);margin-top:7px;text-align:center;}
.bub-nm .count{font-size:9px;color:var(--ink-3);margin-left:4px;}
.font-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--soft);
}
.font-row.sel{border-color:var(--accent);background:var(--panel);}
.font-demo{flex:1;font-size:14px;color:var(--ink);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.font-nm{font-size:11px;color:var(--ink-2);flex:none;}

/* ============ 设置：保存条（改动需点「保存」才生效，防误触） ============ */
#saveBar{
  position:absolute;left:0;right:0;bottom:0;z-index:60;
  transform:translateY(120%);transition:transform .28s cubic-bezier(.22,.9,.3,1);
  background:var(--bar-2);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
  box-shadow:0 -6px 22px rgba(0,0,0,.12);
  display:flex;align-items:center;gap:10px;
}
#saveBar.on{transform:translateY(0);}
#saveBar .sb-txt{flex:1;min-width:0;}
#saveBar .sb-t1{font-size:13px;font-weight:800;color:var(--ink);}
#saveBar .sb-t2{font-size:11px;color:var(--ink-2);margin-top:2px;}
#saveBar button{border:none;cursor:pointer;font-family:inherit;border-radius:14px;font-size:14px;font-weight:700;}
#saveBar .sb-save{flex:none;padding:11px 22px;background:var(--accent);color:var(--accent-ink);}
#saveBar .sb-save[disabled]{opacity:.45;cursor:default;}
#saveBar .sb-undo{flex:none;padding:11px 14px;background:var(--chip);color:var(--ink);font-weight:600;font-size:13px;}
/* 改动项微提示 */
.pending-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0a03f;margin-left:5px;vertical-align:middle;}

/* ============ 设置：我的资料（v2.23.0 重做；v2.24.0：昵称虚线框 + 头像/提示上下分离） ============ */
.my-profile{
  display:flex;gap:16px;align-items:flex-start;margin-top:12px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--glass-1) 90%,transparent),transparent 72%);
  border:1px solid var(--glass-line);border-radius:18px;padding:16px 14px;
}
.my-ava{position:relative;cursor:pointer;flex:none;display:flex;flex-direction:column;align-items:center;gap:9px;padding:2px;}
.my-ava .avatar{width:62px;height:62px;font-size:24px;box-shadow:var(--shadow);outline:2px solid var(--accent);outline-offset:2px;border-radius:20px;}
.my-ava .avatar img{border-radius:17px;}
.my-ava .cam{
  position:absolute;right:-3px;top:-3px;width:23px;height:23px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 7px rgba(0,0,0,.25);border:2px solid var(--panel);z-index:2;
}
.my-ava .cam svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;}
.my-ava:active{transform:scale(.95);}
.my-ava-hint{font-size:11px;color:var(--ink-2);font-weight:600;display:inline-flex;align-items:center;gap:3px;line-height:1;}
.my-ava-hint svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
/* v2.24.0：昵称输入框虚线边框 —— 让「可修改」看得见 */
.my-profile .field input{
  border:1.5px dashed var(--ink-3);background:transparent;font-weight:700;font-size:15.5px;border-radius:12px;
}
.my-profile .field input:focus{border-color:var(--accent);border-style:solid;background:var(--panel);}
.my-nm input{font-weight:800;font-size:15.5px;}
.my-meta{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);margin-top:2px;}
.my-meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* v2.24.0：题库挑选列表（替代原生 select，字号与配色可控） */
.qbank-list{max-height:210px;overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--soft);display:flex;flex-direction:column;}
.qbank-item{
  padding:9px 13px;font-size:13px;color:var(--ink);line-height:1.55;cursor:pointer;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;
}
.qbank-item:last-child{border-bottom:none;}
.qbank-item:active{background:var(--soft-2);}
.qbank-item.on{background:color-mix(in srgb,var(--accent) 10%,var(--soft));color:var(--accent);font-weight:700;}
.qbank-item.on::after{content:'✓';margin-left:auto;font-weight:800;}
/* v2.24.0：下拉框整体收小一号，浅色描边（题库/联系人选择不再突兀） */
.field select{font-size:13.5px;color:var(--ink);background:var(--panel);}

/* ============ 通用弹窗 ============ */
.modal-mask{
  position:absolute;inset:0;z-index:200;background:rgba(42,40,38,.38);
  display:flex;align-items:center;justify-content:center;animation:fadeIn .18s;
}
.modal{
  width:82%;max-width:330px;max-height:86%;overflow-y:auto;
  background:var(--panel);border-radius:20px;padding:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s;
  -webkit-overflow-scrolling:touch;
}
.modal .m-title{font-weight:800;font-size:15px;margin-bottom:12px;text-align:center;}
.modal .m-btns{display:flex;gap:10px;margin-top:14px;}
.modal .m-btns button{flex:1;padding:10px;border:none;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;}
.modal .m-cancel{background:var(--skel);color:var(--ink-2);}
.modal .m-ok{background:var(--ink);color:#fff;font-weight:700;}
.modal .gm-row{display:flex;align-items:center;gap:9px;padding:7px 2px;font-size:14px;border-bottom:1px solid var(--line);}
.modal .stk.sel{outline:2.5px solid var(--ink);outline-offset:1px;}

/* ============ 开屏页：彤话屿（原创 · 极简线条「一座小岛」） ============ */
#splash{
  position:absolute;inset:0;z-index:300;overflow:hidden;cursor:pointer;
  background:var(--splash-bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:background .35s ease;
}
#splash.out{opacity:0;transition:opacity .7s ease;pointer-events:none;}
/* v2.24.12：被须知 / 口令门「按住」时，开屏页只做背景，不再吃点击（防止在它背后偷偷进入网站） */
