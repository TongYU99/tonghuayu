#splash.hold{pointer-events:none;}
/* 小岛：v2.24.21 重绘（分层更细）· 环上一艘小帆船绕岛航行，随浪起伏 */
.sp-ring-wrap{position:relative;width:150px;height:150px;opacity:0;animation:spUp .9s ease .15s forwards;}
.sp-island{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.sp-island .ln{fill:none;stroke:#242424;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.sp-island .ln-thin{fill:none;stroke:#242424;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;opacity:.7;}
.sp-island .ln-fill{fill:#242424;stroke:none;}
.sp-island .isl{animation:spFloat 4.6s ease-in-out infinite;transform-origin:75px 96px;}
@keyframes spFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-3.5px);}}
.sp-island .wv{animation:spWave 5s ease-in-out infinite;}
.sp-island .wv2{animation:spWave 5s ease-in-out infinite;animation-delay:1.5s;}
.sp-island .wv3{animation:spWave 5.6s ease-in-out infinite;animation-delay:2.7s;}
@keyframes spWave{0%,100%{transform:translateX(0);}50%{transform:translateX(-9px);}}
.sp-island .cld{animation:spCloud 13s ease-in-out infinite;}
.sp-island .cld2{animation:spCloud 16s ease-in-out infinite;animation-delay:3s;}
@keyframes spCloud{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
.sp-island .brd{animation:spBird 6.5s ease-in-out infinite;}
.sp-island .brd2{animation:spBird 6.5s ease-in-out infinite;animation-delay:2.4s;}
@keyframes spBird{0%,55%{opacity:0;}10%,45%{opacity:.85;}75%{transform:translate(18px,-7px);opacity:0;}100%{transform:translate(26px,-10px);opacity:0;}}
/* 轨道本身自转；船体反向自转保持正立；中间那层做上下起伏 —— 合起来就是「绕岛航行 + 随浪起伏」 */
.sp-orbit{position:absolute;inset:-4px;animation:spin 19s linear infinite;}
.sp-boat-bob{position:absolute;top:-3px;left:50%;margin-left:-12px;width:24px;height:24px;
  animation:spBob 3.4s ease-in-out infinite;}
@keyframes spBob{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}
.sp-boat{display:block;width:24px;height:24px;animation:spin 19s linear infinite reverse;}
.sp-boat svg{display:block;width:24px;height:24px;animation:spRoll 3.4s ease-in-out infinite;}
@keyframes spRoll{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
.sp-boat path{fill:none;stroke:#242424;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
/* 标题：墨色衬线字（v2.17.0 二次加固：去掉逐字 span 动画，改纯文本整块进场 ——
   逐字 inline-block + animation-delay 组合在部分 XWeb 内核 / 旧缓存下会三字叠印成一坨，
   纯文本节点不存在任何可叠印的合成层） */
.sp-title-wrap{text-align:center;margin-top:28px;opacity:0;animation:fadeIn 1s ease .95s forwards;}
.sp-title{
  font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  font-size:41px;font-weight:600;letter-spacing:16px;text-indent:16px;
  color:#2b2b2b;line-height:1.25;white-space:nowrap;
}
.sp-sub{
  font-size:10px;letter-spacing:6.5px;text-indent:6.5px;color:var(--splash-dim);margin-top:14px;
  opacity:0;animation:fadeIn .9s ease 1.8s forwards;
}
/* 细墨线进度 */
.sp-line-bar{
  width:150px;height:1.5px;background:var(--splash-line);border-radius:1px;overflow:hidden;margin-top:34px;
  opacity:0;animation:fadeIn .6s ease 2s forwards;
}
.sp-line-in{height:100%;width:0;background:#242424;animation:spProg 2.8s ease .2s forwards;}
@keyframes spProg{to{width:100%;}}
/* 轻触进入 */
.sp-touch{
  margin-top:26px;font-size:12px;letter-spacing:6px;color:var(--splash-txt);font-weight:600;
  opacity:0;animation:spTouch 2.4s ease 2.4s infinite;
}
@keyframes spTouch{0%{opacity:0;}25%{opacity:.9;}70%{opacity:.55;}100%{opacity:0;}}
.sp-remember{
  display:flex;align-items:center;gap:6px;margin-top:12px;
  font-size:11px;color:var(--splash-dim);letter-spacing:1px;
  opacity:0;animation:fadeIn .9s ease 2.8s forwards;
}
.sp-remember input{accent-color:#242424;}
/* 底部潮汐细线 */
.sp-tide{
  position:absolute;bottom:36px;left:0;width:100%;height:34px;
  opacity:0;animation:spTideIn 1.2s ease 2.1s forwards;
}
@keyframes spTideIn{to{opacity:.85;}}
.sp-tide path{animation:spTide 5s ease-in-out infinite;}
.sp-tide path.t2{animation-delay:1.4s;}
@keyframes spTide{0%,100%{transform:translateX(0);}50%{transform:translateX(-14px);}}
.sp-tide .l1{stroke:var(--splash-line);}
.sp-tide .l2{stroke:var(--splash-line);}
@keyframes spUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.82);}}
@media (prefers-reduced-motion:reduce){
  #splash *{animation-duration:.01s !important;animation-delay:0s !important;}
}

/* ============ 网站须知（v2.24.11 · 首次进入 / 每次更新 强制阅读） ============ */
#noticeLayer{
  position:absolute;inset:0;z-index:350;display:none;   /* v2.24.12：搬进 #phone，只遮手机屏；350 压过 #splash(300) */
  background:transparent;                 /* 不再自带底色 —— 开屏页就在它下面，两层叠加 */
  align-items:center;justify-content:center;padding:22px;
}
#noticeLayer.on{display:flex;animation:ntFade .5s ease;}
/* v2.24.12：须知卡压住其下的开屏页（半透明玻璃感），只遮手机屏宽、不透出桌面
   注意：下面 .nt-card 有 background:var(--panel)（不透明），本覆盖必须写在它之后才生效，
   所以 #phone .nt-card 的规则放在本段 CSS 末尾（见「玻璃底色收尾」）。 */
#noticeLayer .nt-card{margin:auto;}
html[data-theme="dark"] #phone .nt-card{background:rgba(24,24,28,.82);}
@keyframes ntFade{from{opacity:0}to{opacity:1}}
.nt-card{
  width:100%;max-width:430px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--panel);border-radius:20px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.18);border:1px solid var(--line);
}
.nt-head{padding:22px 22px 12px;text-align:center;flex:0 0 auto;position:relative;}
.nt-ring{
  width:46px;height:46px;border-radius:50%;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;color:#fff;letter-spacing:1px;
  background:var(--splash-grad);
}
.nt-title{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:.5px;}
.nt-sub{font-size:11px;letter-spacing:4px;color:var(--ink-3);margin-top:6px;}
/* v2.24.12：作者署名（顶部 / 底部各一处） */
.nt-author{font-size:11.5px;color:var(--ink-3);margin-top:9px;letter-spacing:.3px;}
.nt-author b{color:var(--ink-2);font-weight:800;}
.nt-author-foot{
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);text-align:center;
}
.nt-body{
  flex:1 1 auto;overflow-y:auto;padding:4px 22px 8px;
  -webkit-overflow-scrolling:touch;
}
.nt-p{
  font-size:13px;line-height:1.85;color:var(--ink-2);margin-bottom:11px;
  text-align:justify;
}
.nt-p b{color:var(--ink);font-weight:800;}
.nt-p .nt-h{display:block;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:2px;}
.nt-hr{height:1px;background:var(--line);margin:13px 0;}
.nt-foot{flex:0 0 auto;padding:12px 22px 20px;border-top:1px solid var(--line);background:var(--panel);}
.nt-check{
  display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;user-select:none;margin-bottom:12px;
}
.nt-check input{
  width:17px;height:17px;flex:0 0 auto;cursor:pointer;accent-color:var(--accent);
}
.nt-btn{
  width:100%;padding:13px;border:none;border-radius:13px;
  font-size:14.5px;font-weight:800;letter-spacing:1px;cursor:pointer;
  color:var(--accent-ink);background:var(--accent);
  transition:opacity .25s ease,filter .25s ease;
}
.nt-btn[disabled]{
  opacity:.42;cursor:not-allowed;filter:grayscale(.35);
}
.nt-remain{font-variant-numeric:tabular-nums;}

/* ============ v2.24.22 · iOS 输入框防放大（自适应收口） ============
   真凶：iOS Safari 只要聚焦一个 font-size < 16px 的 input / textarea / select，
   就会把整个视口放大一档（大约 ×1.3），而且失焦后**不会自动缩回** ——
   用户看到的就是「有时候页面自己变大变小了」。把 viewport 锁死只能挡住手动捏合，
   挡不住这个自动放大，必须在字号上治根。
   这里放在样式表最末尾 + !important，覆盖 .field input(14px) / .todo-add input(13.5px)
   / .my-nm input(15.5px) 等所有旧规则，一次性提到 16px。
   只作用于 ≤820px 的窄屏；桌面浏览器字号维持原样，排版不受影响。 */
@media (max-width:820px){
  /* 排除勾选框 / 单选 / 滑块 —— 它们的尺寸在部分浏览器上跟着 font-size 走，别连带放大 */
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
  textarea,select,[contenteditable="true"],[contenteditable=""]{font-size:16px !important;}
  input,textarea{max-width:100%;}
}

.todo-add input,.my-nm input,.nt-check input{

    document.write('<script src="' + f + '?v=' + B + '"><\/script>');
  });
})();
</script>
<script>
/* ============ 分享控制：下线开关（v2.24.12 精简版） ============
   · window.__OFFLINE__ = true  → 整站下线，访问者只会看到「已下线」提示
   · window.__PASS__ = '口令'   → 口令门（★ v2.24.12 起口令门改由 app.js 的进站流程接管 ★）
   进站顺序 v2.24.12：开屏图标 → 网站须知 → 输入口令 → 开场动画 → 进入网站
   这么排的原因是：口令门要排在「网站须知」之后，而须知只有在主脚本起来后才谈得上「阅读满 30 秒」，
   所以口令门不能再抢在主脚本前面自己弹；主脚本会按 flow 在正确的时机打开它。
   这里只保留「整站下线」的兜底提示（它在任何情况下都必须最先亮出来）。 */
(function(){
  var OFFLINE = (window.__OFFLINE__ === true || String(window.__OFFLINE__) === 'true');
  if(!OFFLINE) return;                             /* 没下线 → 交给主脚本的进站流程 */
  if(window.__SINGLE__) OFFLINE = false;           /* 单文件版不启用下线开关 */
  if(!OFFLINE) return;

  function boot(){
    var lay = document.getElementById('gateLayer');
    if(!lay){ document.addEventListener('DOMContentLoaded', boot); return; }
    document.getElementById('gateTitle').textContent = '已 暂 停 分 享';
    document.getElementById('gateDesc').innerHTML = '这个页面的分享已关闭。<br>如需重新开放，请告诉创建者。';
    lay.classList.add('on');
    var app = document.getElementById('phone');
    if(app) app.style.visibility = 'hidden';
    /* 彻底锁死：屏蔽主脚本的执行入口 */
    window.__BLOCKED__ = true;
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
/* 版本自检：页面若被旧缓存命中，提示一键刷新到最新 */
(function(){
  if(window.__OFFLINE__ === true || String(window.__OFFLINE__) === 'true') return;
  setTimeout(function(){
    try{
      fetch('version.json?t=' + Date.now(), {cache:'no-store'})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){
          if(!j || !j.build) return;
          if(String(j.build) === String(window.__BUILD__)) return;
          if(sessionStorage.getItem('th_ver_skip') === String(j.build)) return;
          var d = document.createElement('div');
          d.id = 'verBar';
          d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:99999;' +
            'background:#1c1c1e;color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;' +
            'box-shadow:0 10px 28px rgba(0,0,0,.3);cursor:pointer;white-space:nowrap;';
          d.innerHTML = '⬆ 有新版本 v' + j.build + '，点此刷新';
          d.onclick = function(){
            sessionStorage.setItem('th_ver_skip', String(j.build));
            location.replace(location.pathname + '?v=' + j.build + '&t=' + Date.now());
          };
          document.body.appendChild(d);
          setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 20000);
        })
        .catch(function(){});
    }catch(e){}
  }, 1200);
})();
</script>
</body>
